services:
  telegram-gemini-bot:
    build: .
    container_name: telegram-gemini-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - TELEGRAM_BOT_TOKEN
      - OPENROUTER_API_KEY
      - GEMINI_API_KEY
      - AI_MODEL
      - GEMINI_MODEL
      - ALLOWED_USER_IDS
      - SYSTEM_INSTRUCTION
      - HTTPS_PROXY
      - PROXY_URL
